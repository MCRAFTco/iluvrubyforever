<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>我爱你RUBY</title><style>*{box-sizing:border-box}[hidden]{display:none!important}:root{color-scheme:light}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 24px;background:#f5f4f0;color:#30332f;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif}main{width:min(340px,100%)}.paper{padding:24px 0}h1{font-family:'Songti SC','STSong',Georgia,serif;font-size:28px;font-weight:400;letter-spacing:5px;margin:0 0 54px}.mark{width:36px;height:26px;border:1px solid #959b91;margin-bottom:30px;position:relative}.mark:after{content:'';position:absolute;width:24px;height:24px;left:5px;top:-13px;border-right:1px solid #959b91;border-bottom:1px solid #959b91;transform:rotate(45deg);clip-path:polygon(100% 0,100% 100%,0 100%)}input,button{font:inherit}input{display:block;width:100%;height:48px;padding:10px 0;background:transparent;border:0;border-bottom:1px solid #c6c9c0;border-radius:0;color:#30332f;font-size:15px;letter-spacing:1px}input::placeholder{color:#898e84}button{cursor:pointer;min-height:46px}button:focus-visible,input:focus-visible{outline:2px solid #777f71;outline-offset:5px}.primary{width:100%;margin-top:26px;padding:12px;background:#40483e;color:#f8f8f4;border:0;border-radius:2px;font-size:13px;letter-spacing:4px}.primary:disabled{opacity:.55;cursor:wait}.status{font-size:12px;line-height:1.8;color:#787e73;margin:16px 0 0;min-height:22px}audio{width:100%;display:block}.text-button{display:block;margin:26px 0 0;padding:0;background:none;border:0;color:#7a8175;font-size:12px;letter-spacing:2px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
body{background:radial-gradient(ellipse at 50% 30%,#faf7ef 0%,#ede7db 75%,#e5ded1 100%);padding:42px 24px;color:#47473f}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23766d58' opacity='.2' filter='url(%23n)' d='M0 0h180v180H0z'/%3E%3C/svg%3E")}main{width:min(390px,100%);position:relative}.paper{padding:0}.letter-top{display:flex;justify-content:space-between;border-top:1px solid #aaa38d70;padding-top:14px;font-size:10px;letter-spacing:3px;color:#8a8778;margin-bottom:54px}.envelope{position:relative;height:174px;width:280px;max-width:90%;margin:0 auto 38px;background:#d4c9b2;transform:rotate(-4deg);box-shadow:2px 22px 28px -12px #66553b40;perspective:900px;transition:transform 1.2s}.insert{position:absolute;inset:10px 14px 6px;background:#fbf8ee;padding:30px 10px;text-align:center;font-family:'Songti SC',serif;font-size:12px;color:#8b8575;transition:transform 1.2s .2s}.envelope-front{position:absolute;inset:0;background:linear-gradient(145deg,#eae0cd,#dfd3bb);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);border:1px solid #cfc2a9}.flap{position:absolute;inset:0;background:linear-gradient(#eee6d7,#dfd4bd);clip-path:polygon(0 0,100% 0,50% 57%);transform-origin:top;transition:transform 1s;z-index:2}.seal{position:absolute;z-index:3;top:72px;left:calc(50% - 19px);width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#737964;color:#f3eedf;font-family:'Songti SC',serif;font-size:10px;letter-spacing:2px;box-shadow:0 2px 5px #4c50352b,inset 0 0 0 3px #ffffff12;transition:opacity .4s}h1{text-align:center;font-size:30px;letter-spacing:10px;margin:0 0 17px;padding-left:10px}.subtitle{text-align:center;color:#8c887b;font-family:'Songti SC',serif;font-size:13px;letter-spacing:2px;margin:0 0 42px}#unlock,#player{max-width:290px;margin:auto}input{text-align:center;font-size:12px;border-color:#b5b09e;letter-spacing:2px}.primary{background:#606953;border-radius:0;font-size:12px;margin-top:22px;position:relative;height:48px;box-shadow:0 6px 16px #5d664114;transition:background .2s}.primary:hover{background:#4c5742}.primary span{position:absolute;right:18px;color:#c1c9b5;font-size:16px;top:14px}.status{text-align:center;max-width:300px;margin:15px auto 0;font-size:11px}.listen-note{text-align:center;font-family:'Songti SC',serif;font-size:13px;color:#8c887b;margin:0 0 18px}.text-button{margin:18px auto 0}.opened .envelope{transform:rotate(0deg) translateY(-3px)}.opened .flap{transform:rotateX(180deg);z-index:0}.opened .insert{transform:translateY(-38px)}.opened .seal{opacity:0}.opened #player{animation:reveal 1.3s ease both}@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-height:740px){.letter-top{margin-bottom:36px}.envelope{height:150px;width:250px;margin-bottom:30px}.seal{top:60px}.subtitle{margin-bottom:26px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.record-button{position:fixed;right:max(20px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));z-index:10;width:48px;height:48px;padding:3px;border:0;background:transparent;border-radius:50%;touch-action:manipulation}.record{display:block;width:42px;height:42px;border-radius:50%;background:repeating-radial-gradient(circle at center,transparent 0 2px,#ffffff0c 2px 3px),conic-gradient(#262923,#51564a,#242721,#41463b,#262923);box-shadow:0 3px 10px #30332625;position:relative;animation:spin 9s linear infinite;animation-play-state:paused}.record:before{content:'';position:absolute;inset:13px;border-radius:50%;background:#a8ad94;border:1px solid #c1c4ac}.record:after{content:'';position:absolute;inset:19px;border-radius:50%;background:#eee8dc}.record-button.playing .record{animation-play-state:running}.record-button:after{content:'';position:absolute;right:2px;bottom:3px;width:6px;height:6px;border-radius:50%;background:#b4b0a1;border:1px solid #f5f0e5}.record-button.playing:after{background:#6b7958}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.record{animation:none!important}}@media(max-width:480px){body{padding-top:80px}}

.music-hint{position:absolute;right:57px;top:13px;display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:11px;letter-spacing:1px;color:#747b68}.music-hint svg{flex:none}.record-button{top:calc(env(safe-area-inset-top,0px) + 16px);right:calc(env(safe-area-inset-right,0px) + 18px);width:50px;height:50px}.record-button.playing .music-hint{color:#8a907e}input{font-size:16px}body{padding:calc(env(safe-area-inset-top,0px) + 94px) max(22px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom,0px) + 28px) max(22px,env(safe-area-inset-left));min-height:100svh}main{min-width:0;width:min(390px,100%)}audio{max-width:100%}@media(max-width:360px){.envelope{width:230px;height:144px}.subtitle{font-size:12px;letter-spacing:1px}.letter-top{margin-bottom:34px}}@media(max-height:600px){body{display:block}main{margin:0 auto}.letter-top{margin-bottom:28px}.envelope{height:130px;width:224px;margin-bottom:24px}.seal{top:51px}.subtitle{margin-bottom:24px}}
</style></head>
<body><button id="music" class="record-button" type="button" aria-label="播放背景音乐" aria-pressed="false" title="播放背景音乐"><span class="music-hint" aria-hidden="true"><span id="music-label">轻点听音乐</span><svg width="33" height="20" viewBox="0 0 33 20" fill="none"><path d="M1 16Q14 1 29 9M23 3l7 6-8 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="record" aria-hidden="true"></span></button><audio id="bgm" src="./bgm.mp3" loop preload="none" hidden playsinline></audio><main><section id="letter" class="paper"><div class="letter-top"><span>To Ruby</span><span aria-hidden="true">来自8800km外</span></div><div class="envelope" aria-hidden="true"><div class="insert">致最好的你</div><div class="flap"></div><div class="envelope-front"></div><div class="seal">LMF</div></div><h1>TO RUBY</h1><p class="subtitle">来自09/07/2026</p><form id="unlock"><label class="sr-only" for="password">密码</label><input id="password" type="password" autocomplete="off" required aria-describedby="status" placeholder="你的生日"><button class="primary" id="submit" type="submit">拆 信 <span aria-hidden="true">↗</span></button></form><div id="player" hidden><p class="listen-note">慢慢听。</p><audio id="audio" controls preload="metadata" aria-label="信件录音"></audio><button id="lock" class="text-button" type="button">关闭</button></div><p id="status" class="status" role="status" aria-live="polite"></p></section><noscript>请开启 JavaScript 后打开。</noscript></main><script>
'use strict';
// Compatible with the original encrypt.html: salt(16) + IV(12) + AES-GCM ciphertext/tag.
async function decryptVoice(bytes,password){
 if(bytes.byteLength<44)throw new Error('录音文件不完整，请重新上传 voice.enc。');
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes.slice(0,16),iterations:300000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(16,28)},key,bytes.slice(28));
}
// The legacy encrypted format has no MIME metadata. Recognize common audio containers.
function audioType(buffer){const b=new Uint8Array(buffer);const s=(a,z)=>String.fromCharCode(...b.slice(a,z));if(s(0,4)==='RIFF'&&s(8,12)==='WAVE')return 'audio/wav';if(s(4,8)==='ftyp')return 'audio/mp4';if(s(0,4)==='OggS')return 'audio/ogg';if(s(0,4)==='fLaC')return 'audio/flac';if(b[0]===0x1a&&b[1]===0x45)return 'audio/webm';return 'audio/mpeg';}
const $=id=>document.getElementById(id);let audioURL=null;

$('unlock').addEventListener('submit',async event=>{
 event.preventDefault();if($('submit').disabled)return;
 if(!crypto.subtle){$('status').textContent='请使用 HTTPS 网站或本机 localhost 打开。';return;}
 if(location.protocol==='file:'){$('status').textContent='本地双击只能预览外观；请部署到 GitHub Pages 后解锁录音。';return;}
 const password=$('password').value;if(!password)return;
 $('submit').disabled=true;$('status').textContent='正在打开你的语音信…';
 try{
  let response;try{response=await fetch('./voice.enc',{cache:'no-store'});}catch{throw new Error('录音下载失败，请检查网络后重试。');}
  if(!response.ok)throw new Error(response.status===404?'还没有找到录音，请把 voice.enc 放在 index.html 旁边。':'录音下载失败，请稍后重试。');
  const bytes=new Uint8Array(await response.arrayBuffer());
  let decrypted;try{decrypted=await decryptVoice(bytes,password);}catch(error){if(error.name==='OperationError')throw new Error('密码不匹配，或录音文件已损坏。请检查后重试。');throw error;}
  audioURL=URL.createObjectURL(new Blob([decrypted],{type:audioType(decrypted)}));
  $('letter').classList.add('opened');$('audio').src=audioURL;$('password').value='';$('unlock').hidden=true;$('player').hidden=false;$('status').textContent='';$('audio').focus();try{await $('audio').play();}catch{$('status').textContent='轻点播放';}
 }catch(error){$('status').textContent=error.message||'暂时无法打开，请重试。';}
 finally{$('submit').disabled=false;}
});
function lock(){ $('letter').classList.remove('opened'); $('audio').pause();$('audio').removeAttribute('src');$('audio').load();if(audioURL)URL.revokeObjectURL(audioURL);audioURL=null;$('player').hidden=true;$('unlock').hidden=false;$('password').value='';$('status').textContent='';}
$('lock').addEventListener('click',()=>{lock();$('password').focus();});
$('audio').addEventListener('error',()=>{if(audioURL)$('status').textContent='已解密，但浏览器无法播放此音频。请用 MP3 原文件重新加密。';});
window.addEventListener('pagehide',lock);

// A quiet original music-box motif, synthesized locally. No music download or tracking.
let customMissing=false,customSource=null,customGain=null;
let musicContext=null,musicBus=null,musicTimer=null,musicWanted=true,musicBusy=false,nextNote=0,noteIndex=0;
const melody=[72,null,76,79,null,76,74,null,69,null,72,76,null,72,71,null,67,null,71,74,null,71,69,null,65,null,69,72,null,69,67,null];
function syncRecord(){const playing=(!customMissing&&!$('bgm').paused)|| (!!musicTimer&&musicContext?.state==='running');$('music-label').textContent=playing?'轻点暂停':'轻点听音乐';$('music').classList.toggle('playing',playing);$('music').setAttribute('aria-pressed',String(playing));$('music').setAttribute('aria-label',playing?'暂停背景音乐':'播放背景音乐');$('music').title=playing?'暂停背景音乐':'播放背景音乐';}
function musicNote(midi,time){const frequency=440*Math.pow(2,(midi-69)/12);for(const [multiple,level] of [[1,.035],[2,.006]]){const oscillator=musicContext.createOscillator(),envelope=musicContext.createGain();oscillator.type='sine';oscillator.frequency.value=frequency*multiple;envelope.gain.setValueAtTime(0,time);envelope.gain.linearRampToValueAtTime(level,time+.035);envelope.gain.exponentialRampToValueAtTime(.0001,time+2.6);oscillator.connect(envelope);envelope.connect(musicBus);oscillator.start(time);oscillator.stop(time+2.7);oscillator.onended=()=>{oscillator.disconnect();envelope.disconnect();};}}
function scheduleMusic(){if(!musicContext||musicContext.state!=='running')return;while(nextNote<musicContext.currentTime+.4){const midi=melody[noteIndex%melody.length];if(midi!==null)musicNote(midi,nextNote);noteIndex++;nextNote+=.72;}}
function prepareMusic(){const AudioEngine=window.AudioContext||window.webkitAudioContext;if(!AudioEngine)return;if(!musicContext){musicContext=new AudioEngine();musicBus=musicContext.createGain();musicBus.gain.value=0;musicBus.connect(musicContext.destination);customGain=musicContext.createGain();customGain.gain.value=.12;customSource=musicContext.createMediaElementSource($('bgm'));customSource.connect(customGain);customGain.connect(musicContext.destination);musicContext.addEventListener('statechange',syncRecord);}}
async function startMusic(){if(!musicWanted||musicBusy||musicTimer||document.hidden||!$('audio').paused)return;musicBusy=true;try{prepareMusic();if(!customMissing){if(musicContext)musicContext.resume().catch(()=>{});else $('bgm').volume=.12;try{await $('bgm').play();if(!musicWanted||document.hidden||!$('audio').paused)$('bgm').pause();return;}catch(error){if(error.name==='NotAllowedError'||error.name==='AbortError')return;customMissing=true;}}if(!musicContext)return;await musicContext.resume();if(!musicWanted||document.hidden||!$('audio').paused||musicContext.state!=='running')return;musicBus.gain.cancelScheduledValues(musicContext.currentTime);musicBus.gain.setTargetAtTime(.65,musicContext.currentTime,.6);nextNote=musicContext.currentTime+.08;scheduleMusic();musicTimer=setInterval(scheduleMusic,200);}catch{}finally{musicBusy=false;syncRecord();}}
function stopMusic(){ $('bgm').pause();if(musicTimer)clearInterval(musicTimer);musicTimer=null;if(musicBus){musicBus.gain.cancelScheduledValues(musicContext.currentTime);musicBus.gain.setTargetAtTime(0,musicContext.currentTime,.12);}syncRecord();}
$('bgm').addEventListener('playing',syncRecord);$('bgm').addEventListener('pause',syncRecord);
$('music').addEventListener('click',()=>{if(musicTimer||!$('bgm').paused){musicWanted=false;stopMusic();}else{musicWanted=true;$('audio').pause();if(musicContext?.state==='suspended')musicContext.resume().catch(()=>{});startMusic();}});
function firstGesture(event){if(event.target.closest('#music'))return;if(musicWanted){if(musicContext?.state==='suspended')musicContext.resume().catch(()=>{});startMusic();}}
document.addEventListener('pointerdown',firstGesture);document.addEventListener('keydown',firstGesture);
$('audio').addEventListener('play',stopMusic);
$('audio').addEventListener('pause',()=>{if(musicWanted)startMusic();});
$('audio').addEventListener('ended',()=>{if(musicWanted)startMusic();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMusic();else startMusic();});
window.addEventListener('pagehide',stopMusic);window.addEventListener('pageshow',startMusic);
startMusic();
</script></body></html>
