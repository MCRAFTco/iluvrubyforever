<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>一封信</title><style>*{box-sizing:border-box}[hidden]{display:none!important}:root{color-scheme:light}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 24px;background:#f5f4f0;color:#30332f;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif}main{width:min(340px,100%)}.paper{padding:24px 0}h1{font-family:'Songti SC','STSong',Georgia,serif;font-size:28px;font-weight:400;letter-spacing:5px;margin:0 0 54px}.mark{width:36px;height:26px;border:1px solid #959b91;margin-bottom:30px;position:relative}.mark:after{content:'';position:absolute;width:24px;height:24px;left:5px;top:-13px;border-right:1px solid #959b91;border-bottom:1px solid #959b91;transform:rotate(45deg);clip-path:polygon(100% 0,100% 100%,0 100%)}input,button{font:inherit}input{display:block;width:100%;height:48px;padding:10px 0;background:transparent;border:0;border-bottom:1px solid #c6c9c0;border-radius:0;color:#30332f;font-size:15px;letter-spacing:1px}input::placeholder{color:#898e84}button{cursor:pointer;min-height:46px}button:focus-visible,input:focus-visible{outline:2px solid #777f71;outline-offset:5px}.primary{width:100%;margin-top:26px;padding:12px;background:#40483e;color:#f8f8f4;border:0;border-radius:2px;font-size:13px;letter-spacing:4px}.primary:disabled{opacity:.55;cursor:wait}.status{font-size:12px;line-height:1.8;color:#787e73;margin:16px 0 0;min-height:22px}audio{width:100%;display:block}.text-button{display:block;margin:26px 0 0;padding:0;background:none;border:0;color:#7a8175;font-size:12px;letter-spacing:2px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style></head>
<body><main><section id="letter" class="paper"><div class="mark" aria-hidden="true"></div><h1>来自8800公里外一封给Ruby的信</h1><form id="unlock"><label class="sr-only" for="password">密码</label><input id="password" type="password" autocomplete="off" required aria-describedby="status" placeholder="密码"><button class="primary" id="submit" type="submit">打开</button></form><div id="player" hidden><audio id="audio" controls preload="metadata" aria-label="信件录音"></audio><button id="lock" class="text-button" type="button">关闭</button></div><p id="status" class="status" role="status" aria-live="polite"></p></section><noscript>请开启 JavaScript 后打开。</noscript></main><script>
'use strict';
// Compatible with the original encrypt.html: salt(16) + IV(12) + AES-GCM ciphertext/tag.
async function decryptVoice(bytes,password){
 if(bytes.byteLength<44)throw new Error('录音文件不完整，请重新上传 voice.enc。');
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes.slice(0,16),iterations:300000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(16,28)},key,bytes.slice(28));
}
// The legacy encrypted format has no MIME metadata. Recognize common audio containers.
function audioType(buffer){const b=new Uint8Array(buffer);const s=(a,z)=>String.fromCharCode(...b.slice(a,z));if(s(0,4)==='RIFF'&&s(8,12)==='WAVE')return 'audio/wav';if(s(4,8)==='ftyp')return 'audio/mp4';if(s(0,4)==='OggS')return 'audio/ogg';if(s(0,4)==='fLaC')return 'audio/flac';if(b[0]===0x1a&&b[1]===0x45)return 'audio/webm';return 'audio/mpeg';}
const $=id=>document.getElementById(id);let audioURL=null;

$('unlock').addEventListener('submit',async event=>{
 event.preventDefault();if($('submit').disabled)return;
 if(!crypto.subtle){$('status').textContent='请使用 HTTPS 网站或本机 localhost 打开。';return;}
 if(location.protocol==='file:'){$('status').textContent='本地双击只能预览外观；请部署到 GitHub Pages 后解锁录音。';return;}
 const password=$('password').value;if(!password)return;
 $('submit').disabled=true;$('status').textContent='正在打开你的语音信…';
 try{
  let response;try{response=await fetch('./voice.enc',{cache:'no-store'});}catch{throw new Error('录音下载失败，请检查网络后重试。');}
  if(!response.ok)throw new Error(response.status===404?'还没有找到录音，请把 voice.enc 放在 index.html 旁边。':'录音下载失败，请稍后重试。');
  const bytes=new Uint8Array(await response.arrayBuffer());
  let decrypted;try{decrypted=await decryptVoice(bytes,password);}catch(error){if(error.name==='OperationError')throw new Error('密码不匹配，或录音文件已损坏。请检查后重试。');throw error;}
  audioURL=URL.createObjectURL(new Blob([decrypted],{type:audioType(decrypted)}));
  $('audio').src=audioURL;$('password').value='';$('unlock').hidden=true;$('player').hidden=false;$('status').textContent='';$('audio').focus();try{await $('audio').play();}catch{$('status').textContent='轻点播放';}
 }catch(error){$('status').textContent=error.message||'暂时无法打开，请重试。';}
 finally{$('submit').disabled=false;}
});
function lock(){ $('audio').pause();$('audio').removeAttribute('src');$('audio').load();if(audioURL)URL.revokeObjectURL(audioURL);audioURL=null;$('player').hidden=true;$('unlock').hidden=false;$('password').value='';$('status').textContent='';}
$('lock').addEventListener('click',()=>{lock();$('password').focus();});
$('audio').addEventListener('error',()=>{if(audioURL)$('status').textContent='已解密，但浏览器无法播放此音频。请用 MP3 原文件重新加密。';});
window.addEventListener('pagehide',lock);
</script></body></html>
