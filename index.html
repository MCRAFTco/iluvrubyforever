<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>FROM CALVIN</title><style>*{box-sizing:border-box}[hidden]{display:none!important}:root{color-scheme:light}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 24px;background:#f5f4f0;color:#30332f;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif}main{width:min(340px,100%)}.paper{padding:24px 0}h1{font-family:'Songti SC','STSong',Georgia,serif;font-size:28px;font-weight:400;letter-spacing:5px;margin:0 0 54px}.mark{width:36px;height:26px;border:1px solid #959b91;margin-bottom:30px;position:relative}.mark:after{content:'';position:absolute;width:24px;height:24px;left:5px;top:-13px;border-right:1px solid #959b91;border-bottom:1px solid #959b91;transform:rotate(45deg);clip-path:polygon(100% 0,100% 100%,0 100%)}input,button{font:inherit}input{display:block;width:100%;height:48px;padding:10px 0;background:transparent;border:0;border-bottom:1px solid #c6c9c0;border-radius:0;color:#30332f;font-size:15px;letter-spacing:1px}input::placeholder{color:#898e84}button{cursor:pointer;min-height:46px}button:focus-visible,input:focus-visible{outline:2px solid #777f71;outline-offset:5px}.primary{width:100%;margin-top:26px;padding:12px;background:#40483e;color:#f8f8f4;border:0;border-radius:2px;font-size:13px;letter-spacing:4px}.primary:disabled{opacity:.55;cursor:wait}.status{font-size:12px;line-height:1.8;color:#787e73;margin:16px 0 0;min-height:22px}audio{width:100%;display:block}.text-button{display:block;margin:26px 0 0;padding:0;background:none;border:0;color:#7a8175;font-size:12px;letter-spacing:2px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
body{background:radial-gradient(ellipse at 50% 30%,#faf7ef 0%,#ede7db 75%,#e5ded1 100%);padding:42px 24px;color:#47473f}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23766d58' opacity='.2' filter='url(%23n)' d='M0 0h180v180H0z'/%3E%3C/svg%3E")}main{width:min(390px,100%);position:relative}.paper{padding:0}.letter-top{display:flex;justify-content:space-between;border-top:1px solid #aaa38d70;padding-top:14px;font-size:10px;letter-spacing:3px;color:#8a8778;margin-bottom:54px}.envelope{position:relative;height:174px;width:280px;max-width:90%;margin:0 auto 38px;background:#d4c9b2;transform:rotate(-4deg);box-shadow:2px 22px 28px -12px #66553b40;perspective:900px;transition:transform 1.2s}.insert{position:absolute;inset:10px 14px 6px;background:#fbf8ee;padding:30px 10px;text-align:center;font-family:'Songti SC',serif;font-size:12px;color:#8b8575;transition:transform 1.2s .2s}.envelope-front{position:absolute;inset:0;background:linear-gradient(145deg,#eae0cd,#dfd3bb);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);border:1px solid #cfc2a9}.flap{position:absolute;inset:0;background:linear-gradient(#eee6d7,#dfd4bd);clip-path:polygon(0 0,100% 0,50% 57%);transform-origin:top;transition:transform 1s;z-index:2}.seal{position:absolute;z-index:3;top:72px;left:calc(50% - 19px);width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#737964;color:#f3eedf;font-family:'Songti SC',serif;font-size:10px;letter-spacing:2px;box-shadow:0 2px 5px #4c50352b,inset 0 0 0 3px #ffffff12;transition:opacity .4s}h1{text-align:center;font-size:30px;letter-spacing:10px;margin:0 0 17px;padding-left:10px}.subtitle{text-align:center;color:#8c887b;font-family:'Songti SC',serif;font-size:13px;letter-spacing:2px;margin:0 0 42px}#unlock,#player{max-width:290px;margin:auto}input{text-align:center;font-size:12px;border-color:#b5b09e;letter-spacing:2px}.primary{background:#606953;border-radius:0;font-size:12px;margin-top:22px;position:relative;height:48px;box-shadow:0 6px 16px #5d664114;transition:background .2s}.primary:hover{background:#4c5742}.primary span{position:absolute;right:18px;color:#c1c9b5;font-size:16px;top:14px}.status{text-align:center;max-width:300px;margin:15px auto 0;font-size:11px}.listen-note{text-align:center;font-family:'Songti SC',serif;font-size:13px;color:#8c887b;margin:0 0 18px}.text-button{margin:18px auto 0}.opened .envelope{transform:rotate(0deg) translateY(-3px)}.opened .flap{transform:rotateX(180deg);z-index:0}.opened .insert{transform:translateY(-38px)}.opened .seal{opacity:0}.opened #player{animation:reveal 1.3s ease both}@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-height:740px){.letter-top{margin-bottom:36px}.envelope{height:150px;width:250px;margin-bottom:30px}.seal{top:60px}.subtitle{margin-bottom:26px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body><main><section id="letter" class="paper"><div class="letter-top"><span>来自8800km外给ruby的一封信</span><span aria-hidden="true">01</span></div><div class="envelope" aria-hidden="true"><div class="insert">来自09/07/2026</div><div class="flap"></div><div class="envelope-front"></div><div class="seal">LMF</div></div><h1>给最好的你</h1><p class="subtitle">CALVIN</p><form id="unlock"><label class="sr-only" for="password">密码</label><input id="password" type="password" autocomplete="off" required aria-describedby="status" placeholder="我们约定的密码"><button class="primary" id="submit" type="submit">拆 信 <span aria-hidden="true">↗</span></button></form><div id="player" hidden><p class="listen-note">慢慢听。</p><audio id="audio" controls preload="metadata" aria-label="信件录音"></audio><button id="lock" class="text-button" type="button">关闭</button></div><p id="status" class="status" role="status" aria-live="polite"></p></section><noscript>请开启 JavaScript 后打开。</noscript></main><script>
'use strict';
// Compatible with the original encrypt.html: salt(16) + IV(12) + AES-GCM ciphertext/tag.
async function decryptVoice(bytes,password){
 if(bytes.byteLength<44)throw new Error('录音文件不完整，请重新上传 voice.enc。');
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes.slice(0,16),iterations:300000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(16,28)},key,bytes.slice(28));
}
// The legacy encrypted format has no MIME metadata. Recognize common audio containers.
function audioType(buffer){const b=new Uint8Array(buffer);const s=(a,z)=>String.fromCharCode(...b.slice(a,z));if(s(0,4)==='RIFF'&&s(8,12)==='WAVE')return 'audio/wav';if(s(4,8)==='ftyp')return 'audio/mp4';if(s(0,4)==='OggS')return 'audio/ogg';if(s(0,4)==='fLaC')return 'audio/flac';if(b[0]===0x1a&&b[1]===0x45)return 'audio/webm';return 'audio/mpeg';}
const $=id=>document.getElementById(id);let audioURL=null;

$('unlock').addEventListener('submit',async event=>{
 event.preventDefault();if($('submit').disabled)return;
 if(!crypto.subtle){$('status').textContent='请使用 HTTPS 网站或本机 localhost 打开。';return;}
 if(location.protocol==='file:'){$('status').textContent='本地双击只能预览外观；请部署到 GitHub Pages 后解锁录音。';return;}
 const password=$('password').value;if(!password)return;
 $('submit').disabled=true;$('status').textContent='正在打开你的语音信…';
 try{
  let response;try{response=await fetch('./voice.enc',{cache:'no-store'});}catch{throw new Error('录音下载失败，请检查网络后重试。');}
  if(!response.ok)throw new Error(response.status===404?'还没有找到录音，请把 voice.enc 放在 index.html 旁边。':'录音下载失败，请稍后重试。');
  const bytes=new Uint8Array(await response.arrayBuffer());
  let decrypted;try{decrypted=await decryptVoice(bytes,password);}catch(error){if(error.name==='OperationError')throw new Error('密码不匹配，或录音文件已损坏。请检查后重试。');throw error;}
  audioURL=URL.createObjectURL(new Blob([decrypted],{type:audioType(decrypted)}));
  $('letter').classList.add('opened');$('audio').src=audioURL;$('password').value='';$('unlock').hidden=true;$('player').hidden=false;$('status').textContent='';$('audio').focus();try{await $('audio').play();}catch{$('status').textContent='轻点播放';}
 }catch(error){$('status').textContent=error.message||'暂时无法打开，请重试。';}
 finally{$('submit').disabled=false;}
});
function lock(){ $('letter').classList.remove('opened'); $('audio').pause();$('audio').removeAttribute('src');$('audio').load();if(audioURL)URL.revokeObjectURL(audioURL);audioURL=null;$('player').hidden=true;$('unlock').hidden=false;$('password').value='';$('status').textContent='';}
$('lock').addEventListener('click',()=>{lock();$('password').focus();});
$('audio').addEventListener('error',()=>{if(audioURL)$('status').textContent='已解密，但浏览器无法播放此音频。请用 MP3 原文件重新加密。';});
window.addEventListener('pagehide',lock);
</script></body></html>
